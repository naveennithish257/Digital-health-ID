name: MedVault CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Validate Server Syntax
        run: node -c server.js

      - name: Run ESLint
        run: npm run lint || true

      - name: Run Test Suite
        env:
          NODE_ENV: test
          DB_HOST: ${{ secrets.DB_HOST || 'gateway01.ap-southeast-1.prod.aws.tidbcloud.com' }}
          DB_PORT: ${{ secrets.DB_PORT || '4000' }}
          DB_USER: ${{ secrets.DB_USER || '2HiVsqYJBJTzGBm.root' }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD || 'ZcuA42MgiOr3tK62' }}
          DB_NAME: ${{ secrets.DB_NAME || 'health_id_system' }}
          DB_SSL: 'true'
          JWT_SECRET: medvault-super-secure-jwt-secret-key-2026
          JWT_REFRESH_SECRET: medvault-refresh-token-secret-key-2026
          ADMIN_PASSWORD: Admin@MedVault2026!
        run: npm test

