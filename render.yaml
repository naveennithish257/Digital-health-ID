services:
  - type: web
    name: medvault-backend-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install --legacy-peer-deps
    startCommand: node server.js
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: FRONTEND_URL
        value: https://digital-health-id-8a079.web.app

      # ── Database (TiDB Cloud) ──────────────────────────────────
      - key: DB_HOST
        value: gateway01.ap-southeast-1.prod.aws.tidbcloud.com
      - key: DB_PORT
        value: "4000"
      - key: DB_USER
        value: 2HiVsqYJBJTzGBm.root
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: health_id_system
      - key: DB_SSL
        value: "true"

      # ── JWT ───────────────────────────────────────────────────
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false

      # ── Cloudinary ────────────────────────────────────────────
      - key: CLOUDINARY_CLOUD_NAME
        value: lcuudulv
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      # ── Gmail SMTP (Universal Multi-User Deliverability) ──────
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        value: naveennithish257@gmail.com
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        value: "MedVault Health ID <naveennithish257@gmail.com>"

      # ── Resend Email (Fallback) ───────────────────────────────
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_EMAIL_FROM
        value: "MedVault <onboarding@resend.dev>"

      # ── Brevo HTTPS API (Universal Multi-User Deliverability) ─
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        value: naveennithish257@gmail.com

      # ── Fast2SMS ──────────────────────────────────────────────
      - key: FAST2SMS_API_KEY
        sync: false

      # ── MSG91 ─────────────────────────────────────────────────
      - key: MSG91_AUTH_KEY
