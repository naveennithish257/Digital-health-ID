apiVersion: v1
kind: Secret
metadata:
  name: medvault-secrets
  namespace: medvault
  labels:
    app: medvault
type: Opaque
stringData:
  DB_USER: "REPLACE_WITH_YOUR_DB_USER"
  DB_PASSWORD: "REPLACE_WITH_YOUR_DB_PASSWORD"
  JWT_SECRET: "REPLACE_WITH_STRONG_RANDOM_SECRET"
  JWT_REFRESH_SECRET: "REPLACE_WITH_STRONG_RANDOM_REFRESH_SECRET"
  CLOUDINARY_API_KEY: "REPLACE_WITH_CLOUDINARY_API_KEY"
  CLOUDINARY_API_SECRET: "REPLACE_WITH_CLOUDINARY_API_SECRET"
  RESEND_API_KEY: "REPLACE_WITH_RESEND_API_KEY"
  GEMINI_API_KEY: "REPLACE_WITH_GEMINI_API_KEY"
  ADMIN_EMAIL: "admin@medvault.health"
  ADMIN_PASSWORD: "REPLACE_WITH_STRONG_ADMIN_PASSWORD"
